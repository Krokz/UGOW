name: Tests

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]
  # Weekly, so a runner image change that breaks the suite shows up without a
  # commit to trigger it. Dependency updates arrive as Dependabot PRs.
  schedule:
    - cron: '0 6 * * 1'
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      # Let every version finish, so one failure does not hide the others.
      fail-fast: false
      matrix:
        python-version: ['3.10', '3.11', '3.12', '3.13']

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          sudo apt-get update -qq && sudo apt-get install -y libfuse2
          pip install -r requirements.txt
          pip install -r requirements-dev.txt

      - name: Run tests
        # The real-mount tests skip when FUSE or passwordless sudo is missing;
        # here that must fail instead, or the suite could go quietly empty.
        env:
          UGOW_FUSE_TESTS: require
        run: pytest tests/ -v -rs

  docs:
    # docs.yml only builds the site on main, as part of deploying it, so a
    # page that breaks --strict would otherwise surface as a failed deploy.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - run: pip install -r requirements-docs.txt

      - run: mkdocs build --strict
